name: Validate tips

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Headlines for the news panel; a source that cannot be read is skipped.
      - run: node scripts/news.mjs
      - run: npm run build
